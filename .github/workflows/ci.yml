name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: Lint (ruff)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: requirements-dev.txt
      - run: pip install ruff==0.17.0
      - run: ruff check .

  test:
    name: Testes (${{ matrix.db }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        db: [sqlite, postgres]
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: rc_test
          POSTGRES_USER: rc
          POSTGRES_PASSWORD: rc
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U rc -d rc_test"
          --health-interval 5s --health-timeout 3s --health-retries 20
    env:
      TEST_DATABASE_URL: ${{ matrix.db == 'postgres' && 'postgresql+psycopg://rc:rc@localhost:5432/rc_test' || '' }}
      JWT_SECRET: ci-only-secret-not-used-anywhere-else-0123456789
      ENABLE_SCHEDULER: "false"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: requirements-dev.txt
      - run: pip install -r requirements-dev.txt
      - run: pytest

  docker:
    name: Docker Compose (sobe a aplicação + PostgreSQL)
    runs-on: ubuntu-latest
    needs: [lint, test]
    steps:
      - uses: actions/checkout@v4
      - name: Gera um .env só para o CI
        run: |
          cp .env.example .env
          sed -i "s|^JWT_SECRET=.*|JWT_SECRET=$(openssl rand -hex 32)|" .env
          sed -i "s|^POSTGRES_PASSWORD=.*|POSTGRES_PASSWORD=$(openssl rand -hex 16)|" .env
          sed -i "s|^ADMIN_PASSWORD=.*|ADMIN_PASSWORD=Ci-$(openssl rand -hex 8)|" .env
      - run: docker compose up -d --build
      - name: Espera a aplicação responder
        run: |
          for i in $(seq 1 40); do
            if curl -fsS http://localhost:8000/health; then echo; exit 0; fi
            sleep 3
          done
          docker compose logs app
          exit 1
      - name: Confere telas e migração
        run: |
          curl -fsS -o /dev/null http://localhost:8000/
          curl -fsS -o /dev/null http://localhost:8000/indicadores
          curl -fsS http://localhost:8000/kpi > /dev/null
          docker compose exec -T db psql -U running -d running_control -tc "select version_num from alembic_version"
      - if: always()
        run: docker compose down -v
