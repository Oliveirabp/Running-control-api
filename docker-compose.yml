# Sobe a aplicação + PostgreSQL:   docker compose up -d --build
# Antes, copie .env.example para .env e preencha JWT_SECRET, ADMIN_* e POSTGRES_PASSWORD.
services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-running_control}
      POSTGRES_USER: ${POSTGRES_USER:-running}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?defina POSTGRES_PASSWORD no .env}
      TZ: America/Sao_Paulo
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 20
    # Sem "ports": o banco só é acessível pela aplicação, dentro da rede do compose.

  app:
    build: .
    image: running-control-api:latest
    restart: unless-stopped
    env_file: .env
    environment:
      # Sobrescreve o DATABASE_URL do .env para apontar para o serviço "db".
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-running}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-running_control}
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "${APP_PORT:-8000}:8000"

volumes:
  pgdata:
